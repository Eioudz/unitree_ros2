# Go2 costmap 组件参数（nav2_controller + nav2_planner 承载全局/局部代价地图）
#
# TF 链：map --(AMCL)--> odom --(odom_tf_bridge)--> base_link(_level)
# /scan 由 livox_scan.py 产出（frame: base_link_level，range_min=0.55 已屏蔽前腿自点）
# 全部时间戳为本机时钟域（见 livox_scan.py 头注释），Nav2 查 TF 同源自洽。
#
# CPU 预算（沿用 2026-11-04 降载结论，避免 cmd_vel 断续）：
#   DWB 10Hz + 10x20 轨迹采样 + 1.5s 仿真时间（约为默认配置负载的 1/14）
#   局部 costmap 2Hz 更新 / 1Hz 发布；全局 costmap 1Hz 更新 / 0.5Hz 发布
#
# 速度链路（2026-11-11 加入 Collision Monitor）：
#   DWB -> /cmd_vel_raw -> collision_monitor(减速/急停) -> /cmd_vel
#   -> cmd_vel_sport_bridge -> 1008 MOVE
#   collision_monitor 直接订阅 /scan（~10Hz），不排队等 costmap 2Hz 更新，
#   补上"动态障碍两帧间位移 0.6m"的反应盲区；近身 <0.55m 盲区由狗固件超声兜底。
#
# 动态绕障（2026-11-16 调整，对齐"雷达发现障碍入图 -> 膨胀 -> 重规划绕行"）：
#   此前实测（11-13 session）遇未建图障碍只会顶停：costmap/规划均正常
#   （planner 全程无 WARN），败在执行层三重冲突——DWB 代价梯度太薄
#   （inflation 0.45 + obstacle critic scale 0.1，贴障碍与绕行同分）被
#   collision_monitor Stop 区冻结；Stop 区宽 ±0.3 覆盖了 DWB 合法通过带；
#   spin 恢复按 acc 1.5 下发而固件实际 ~0.04rad/s²，10s 限时必超时。
#   分层修正（全局宽绕行、局部精执行、monitor 只兜底）：
#   - 全局：global_costmap 保持外接圆 robot_radius 0.39（=局部矩形外接圆，
#     与 11-16 精度修正保持一致）+ inflation 0.45->0.55，路径提前弯出宽绕行线；
#   - 局部：local_costmap 改矩形 footprint（0.35x0.16 外接，按狗真实体型），
#     DWB 换 ObstacleFootprint critic（按轮廓查碰撞）scale 0.5，
#     inflation 0.45->0.55，0.35m+ 缝隙可通过；
#   - monitor：Stop/Slow 侧向宽度收窄（±0.3->±0.22 / ±0.45->±0.35），前沿
#     不动（正面急停/减速保护不变），不再误杀侧向绕行；
#   - spin：acc 1.5->0.1、max_vel 0.4->0.25，BT spin_dist 1.57->1.0，
#     按固件真实转速下发，10s 限时内约 5.3s 完成。
#
# 转速修正（2026-11-16 二次调整，此前"固件加速仅 0.04rad/s²"的结论不成立）：
#   11-03/11-04/11-06 的 behavior_server 日志里，同样 1.57rad 的 spin 只用了
#   2.9~4.3s（平均 0.36~0.54rad/s），说明固件能转这么快；而 11-14 把 spin
#   降到 0.25rad/s + acc 0.1 后，11-14/11-16 的 spin 反而全部 10s 超时
#   （低速指令很可能低于固件原地转向的有效下限，被直接忽略）。
#   现恢复转速：DWB/monitor 上限 0.4->0.8，spin 0.6rad/s、acc 0.8、
#   min 0.25（避免下发无效低速），BT spin_dist 维持 1.0。
#
# 提速（2026-11-17）：导航整体太慢，线速度 0.25->0.5m/s、角速度 0.8->1.2rad/s：
#   - DWB：max_vel_x/max_speed_xy -> 0.5，max_vel_theta -> 1.2；
#   - cmd_vel_sport_bridge：max_vx/max_wz 默认值同步抬高（否则桥限幅把
#     DWB 的新上限掐死，提速无效）；
#   - sim_time 3.0 与采样数 6x16 不动：前瞻随速度自动放大到 0.5*3.0=1.5m
#     （> 0.8m 安全边），轨迹点数按 6*16*3.0 计与 11-04 已验证负载同量级；
#   - collision_monitor 不动：slowdown ratio 0.5，贴障减速后 0.25m/s
#     （= 原全速），安全层不放松。

controller_server:
  ros__parameters:
    use_sim_time: false
    controller_frequency: 10.0
    odom_topic: "/odom_local"
    min_x_velocity_threshold: 0.001
    min_y_velocity_threshold: 0.001
    min_theta_velocity_threshold: 0.001
    failure_tolerance: 0.3
    progress_checker_plugin: "progress_checker"
    progress_checker:
      plugin: "nav2_controller::SimpleProgressChecker"
      required_movement_radius: 0.4     # 15s 内位移不足 0.4m 判无进展
      movement_time_allowance: 15.0
    goal_checker_plugins: ["goal_checker"]
    goal_checker:
      plugin: "nav2_controller::SimpleGoalChecker"
      stateful: true
      # 2026-11-16 收紧到点精度（原 0.4m/2π）：位置 0.25m，朝向恢复到 0.3rad
      # （≈17°）。goto_node 现在用"机器人->目标"方位角作目标朝向，正常进近
      # 时几乎不用原地补转；转速已恢复到 0.8rad/s，补转也能在限时内完成。
      xy_goal_tolerance: 0.25
      yaw_goal_tolerance: 0.3
    controller_plugins: ["FollowPath"]
    FollowPath:
      plugin: "dwb_core::DWBLocalPlanner"
      debug_trajectory_details: false
      # Go2 限速（2026-11-18 禁倒车）：前进 <=0.5m/s，min_vel_x=0 硬约束
      # 不许后退——贴脸障碍时靠原地 Spin 转向绕行，不倒车。
      # 角速度 <=1.2rad/s
      min_vel_x: 0.0
      min_vel_y: 0.0
      max_vel_x: 0.5
      max_vel_y: 0.0
      max_vel_theta: 1.2
      min_speed_xy: 0.0
      max_speed_xy: 0.5
      min_speed_theta: 0.0
      acc_lim_x: 1.0
      acc_lim_y: 0.0
      acc_lim_theta: 1.5
      decel_lim_x: -1.5
      decel_lim_y: 0.0
      decel_lim_theta: -2.0
      # 采样降载 + 前瞻保距：sim_time 3.0s * 0.5m/s = 1.5m 前瞻，大于
      # robot_radius+inflation=0.8m 的边缘（2026-11-14 实测前瞻不足时 DWB
      # "看不见"前方障碍，蹭到急停区卡死；提速后前瞻反而更远，更安全）。
      # 采样数维持 6x16（2026-11-17 提速未动，CPU 不升）：提速后 vx 档位
      # -0.15~0.5 粒度 ~0.13、vtheta ±1.2 粒度 ~0.16，避障若发糙再微调采样数
      vx_samples: 6
      vy_samples: 1
      vtheta_samples: 16
      sim_time: 3.0
      linear_granularity: 0.05
      angular_granularity: 0.025
      transform_tolerance: 0.5
      xy_goal_tolerance: 0.25    # 与 goal_checker 同步收紧（原 0.4）
      # 须低于 max_vel_x，否则前进中会被当作"已停"，RotateToGoal 提前介入
      trans_stopped_velocity: 0.15
      short_circuit_trajectory_evaluation: true
      stateful: true
      # 2026-11-18 恢复 ObstacleFootprint critic：local costmap 重新加入
      # static_layer 后有静态障碍数据，DWB 需要障碍 critic 来避开墙壁。
      # 不加 ObstacleFootprint 时所有轨迹的障碍代价=0，路径跟踪方向感不足
      # 可能导致零速度输出（"不会走"的根因之一）。
      critics: ["RotateToGoal", "PathAlign", "GoalAlign", "PathDist", "GoalDist", "ObstacleFootprint", "Oscillation"]
      PathAlign.scale: 32.0
      PathAlign.forward_point_distance: 0.1
      GoalAlign.scale: 24.0
      GoalAlign.forward_point_distance: 0.1
      PathDist.scale: 32.0
      GoalDist.scale: 24.0
      ObstacleFootprint.scale: 0.5
      # Oscillation critic：记录上一帧速度方向，对反向轨迹加惩罚，
      # 消除左右摇摆（左/右轨迹得分接近时每帧来回切换的典型问题）
      Oscillation.scale: 1.0
      Oscillation.x_only: false
      RotateToGoal.scale: 32.0
      RotateToGoal.slowing_factor: 5.0
      RotateToGoal.lookahead_time: -1.0

planner_server:
  ros__parameters:
    use_sim_time: false
    # 全局路径重规划频率由调用方（BT/上层节点）决定，此值为 action server 预期值
    expected_planner_frequency: 0.5
    planner_plugins: ["GridBased"]
    GridBased:
      plugin: "nav2_navfn_planner/NavfnPlanner"
      tolerance: 0.3          # 目标点被占时，允许在 0.3m 邻域内给出替代点
      # 与 goal_checker 的 0.25m 合并后最坏偏差约 0.55m（原 0.5+0.4=0.9m）
      use_astar: false
      allow_unknown: false

# ---- 局部代价地图（滚动窗，挂在 controller_server 内）----
# 2026-11-18 恢复局部实时障碍：local costmap 重新加入 obstacle_layer，订阅
# /scan（livox_scan.py 产出，frame=base_link_level，~10Hz），把雷达看到的
# 实时障碍标进滚动窗，再由 inflation_layer 膨胀出代价梯度。RViz 里能直接
# 看到"点云障碍 -> 红色膨胀圈"随狗移动刷新。
#   注意：livox_scan 的时间戳已在 11-18 改为贴近本机发布时刻，obstacle_layer
#   按 scan.stamp 查 odom->base_link_level 不再 extrapolate-into-past 丢帧。
#   全局 costmap 仍只用静态图（实时障碍只进局部，规划走预建墙 + 局部绕行）。
local_costmap:
  local_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 2.0
      publish_frequency: 1.0
      global_frame: odom
      robot_base_frame: base_link_level
      rolling_window: true
      width: 4        # humble 的 Costmap2DROS 声明 width/height 为整数，写 4.0 会 SIGABRT
      height: 4
      resolution: 0.05
      transform_tolerance: 1.0
      # 矩形 footprint（0.35x0.16m 外接，按狗真实体型 0.70x0.32m）：内切半径
      # 0.16m，0.35m+ 的缝隙可通过；设置 footprint 后 robot_radius 被忽略
      footprint: "[[0.35, 0.16], [0.35, -0.16], [-0.35, -0.16], [-0.35, 0.16]]"
      # 局部代价地图三层：static（预建墙）+ obstacle（/scan 实时障碍）+ inflation
      # static_layer 让 DWB 的 PathAlign/PathDist critics 能感知墙壁；obstacle_layer
      # 负责把雷达实时扫到的未建图障碍标进滚动窗，供 inflation 膨胀 + DWB 绕行。
      plugins: ["static_layer", "obstacle_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      obstacle_layer:
        plugin: "nav2_costmap_2d::ObstacleLayer"
        enabled: true
        observation_sources: scan
        scan:
          topic: /scan
          # /scan 由 livox_scan 输出在 base_link_level（= robot_base_frame），
          # 传感器原点与机器人体中心重合，高度带直接按机身水平面取
          sensor_frame: base_link_level
          data_type: "LaserScan"
          # 只把"能绊到狗/挡到机身"的高度带当障碍：低于地面 -0.15 是地面
          # 噪声，高于 0.35 是桌面以上（狗可从下方钻过，不应判为墙）
          min_obstacle_height: -0.15
          max_obstacle_height: 0.35
          # 标记/清除都用射线：raytrace 让雷达扫过的空间被清空（动态障碍
          # 走开后旧标记消失），否则静态残留会把通道堵死
          marking: true
          clearing: true
          # 量程压到 4.0：局部窗只有 4x4m，中心到对角 2.83m，超出窗外的标记/
          # 射线清除都会被裁掉，纯浪费 CPU（按 12m 做 raytrace 是 4m 的 3 倍
          # 开销，11-04 的降载结论要求省 CPU）
          raytrace_max_range: 4.0
          raytrace_min_range: 0.0
          obstacle_max_range: 4.0
          obstacle_min_range: 0.55     # 与 livox_scan range_min 一致（屏蔽前腿自点）
          # livox_scan 对空 bin 发 inf（publish_inf=True）。必须按有效量程处理：
          # 当作 raytrace_max_range 参与清除，雷达扫过的空区域才会被清空。
          # 若设 false，空 bin 被整条丢弃 -> 障碍走开后旧标记不消失，通道会
          # 被历史障碍堵死。
          inf_is_valid: true
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        inflation_radius: 0.55
      always_send_full_costmap: true

# ---- 全局代价地图（静态图 + 实时障碍层，挂在 planner_server 内）----
global_costmap:
  global_costmap:
    ros__parameters:
      use_sim_time: false
      update_frequency: 1.0
      publish_frequency: 0.5
      global_frame: map
      robot_base_frame: base_link_level
      resolution: 0.05
      # 2026-11-18 把 transform_tolerance 从 0.5 抬到 2.0：同一链路下 scan
      # 时间戳经无线中继+聚合偏旧（实测 ~0.36s），局部/全局 obstacle_layer 在
      # 过短的 tolerance 内按 scan.stamp 查 TF 得 extrapolate-past 而丢帧——
      # 全局被 static 地图掩盖看不出来，局部（纯 obstacle）暴露为全空。
      track_unknown_space: true
      transform_tolerance: 2.0
      # 外接圆 0.39 = 局部矩形 footprint 的外接半径 √(0.35²+0.16²)=0.385，
      # 取整到 0.39。全局若仍按 0.35 规划，局部按真实轮廓查碰撞时会判为贴障
      # （贴边走抖动/出界）。窄口仍由局部 DWB 按真实体型收窄。
      robot_radius: 0.39
      plugins: ["static_layer", "inflation_layer"]
      static_layer:
        plugin: "nav2_costmap_2d::StaticLayer"
        map_subscribe_transient_local: true
      # 2026-11-18 去掉全局实时避障：全局只用预建静态地图 + 膨胀。
      # obstacle_layer（雷达实时标记）从插件列表移除，让规划完全基于静态墙。
      inflation_layer:
        plugin: "nav2_costmap_2d::InflationLayer"
        cost_scaling_factor: 3.0
        # 静态墙膨胀半径：让路径与墙保持安全距离
        inflation_radius: 0.55
      always_send_full_costmap: true

# ---- 行为树导航器（接收 /goal_pose，调度规划/控制/recovery）----
bt_navigator:
  ros__parameters:
    use_sim_time: false
    global_frame: "map"
    robot_base_frame: "base_link_level"
    odom_topic: "/odom_local"
    bt_loop_duration: 10
    default_server_timeout: 20
    # 官方两棵默认树（to_pose 与 through_poses）的 recovery 都含 BackUp（倒车），
    # 机器人禁倒车必须换成去掉 BackUp 的自定义树，否则 bt_navigator activate
    # 因 backup action server 缺失直接失败
    default_nav_to_pose_bt_xml: "/home/soyo/unitree_ros2/cyclonedds_ws/install/nav/share/nav/behavior_trees/navigate_to_pose_no_backup.xml"
    default_nav_through_poses_bt_xml: "/home/soyo/unitree_ros2/cyclonedds_ws/install/nav/share/nav/behavior_trees/navigate_through_poses_no_backup.xml"

# ---- 恢复行为服务器（只开 spin/wait，禁 backup 倒车）----
behavior_server:
  ros__parameters:
    use_sim_time: false
    local_costmap_topic: "local_costmap/costmap_raw"
    local_footprint_topic: "local_costmap/published_footprint"
    global_costmap_topic: "global_costmap/costmap_raw"
    global_footprint_topic: "global_costmap/published_footprint"
    cycle_frequency: 10.0
    behavior_plugins: ["spin", "wait"]
    spin:
      plugin: "nav2_behaviors/Spin"
    wait:
      plugin: "nav2_behaviors/Wait"
    global_frame: "odom"
    robot_base_frame: "base_link_level"
    transform_tolerance: 0.5
    simulate_ahead_time: 2.0
    # 2026-11-16 修正：旧日志（11-03~11-06）1.57rad spin 只用 2.9~4.3s，
    # 即狗能跑到 ~0.5rad/s；11-14 的 0.25/0.1 反而让 spin 全部 10s 超时
    # （低速指令可能低于固件原地转向有效下限）。恢复 0.6rad/s、acc 0.8，
    # min 抬到 0.25 避免下发无效低速；1.0rad 约 2.5s 完成。
    # spin_dist 维持 1.0：见 behavior_trees/navigate_to_pose_no_backup.xml
    max_rotational_vel: 0.6
    min_rotational_vel: 0.25
    rotational_acc_lim: 0.8

lifecycle_manager_navigation:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 8.0
    node_names:
    - "controller_server"
    - "planner_server"
    - "behavior_server"
    - "bt_navigator"
