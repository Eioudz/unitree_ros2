# Go2 真机定位参数（Nav2 map_server + AMCL）
#
# TF 链：map --(AMCL)--> odom --(odom_tf_bridge)--> base_link / base_link_level
# /scan 的 frame 为 base_link_level，故 AMCL 的 base_frame_id 必须取它。
# 所有时间戳均来自机器人时钟（scan 与 odom 同源），主机时钟慢 ~124 天无影响。

map_server:
  ros__parameters:
    use_sim_time: false
    # 定位用栅格地图（map:= 参数会覆盖此值）
    yaml_filename: "/home/soyo/maps/lab_map.yaml"
    topic_name: "map"
    frame_id: "map"

amcl:
  ros__parameters:
    use_sim_time: false
    # 坐标系
    global_frame_id: "map"
    odom_frame_id: "odom"
    base_frame_id: "base_link_level"
    scan_topic: "/scan"

    # 雷达模型：前腿自身在 ~0.52m，与建图时一致取 0.55 以下屏蔽
    laser_model_type: "likelihood_field"
    laser_min_range: 0.55
    laser_max_range: 12.0
    max_beams: 120
    laser_likelihood_max_dist: 2.0

    # 低于此平移/旋转量不更新滤波器；调小让位姿修正更及时
    update_min_d: 0.1
    update_min_a: 0.1

    # LIO 里程计整体较准，但转弯段 yaw 误差偏大：alpha1 取 0.2 让粒子在旋转时
    # 适当扩散，靠激光匹配快速拉回，避免 map->odom 修正在转弯时滞后
    robot_model_type: "nav2_amcl::DifferentialMotionModel"
    alpha1: 0.2        # 旋转->旋转
    alpha2: 0.1        # 平移->旋转
    alpha3: 0.1        # 平移->平移
    alpha4: 0.1        # 旋转->平移
    alpha5: 0.1
    min_particles: 500
    max_particles: 2000

    # 初始位姿：默认关（启动后用 RViz 2D Pose Estimate 手动给定）。
    # 若狗每次都从固定点开机，可改 true 并填好 initial_pose 后免手动。
    set_initial_pose: false
    # initial_pose.x: 0.0
    # initial_pose.y: 0.0
    # initial_pose.yaw: 0.0

    transform_tolerance: 1.0
    tf_broadcast: true
    resample_interval: 1
    save_pose_rate: 0.5

lifecycle_manager_localization:
  ros__parameters:
    use_sim_time: false
    autostart: true
    bond_timeout: 8.0
    node_names:
      - "map_server"
      - "amcl"
